<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>J&K Smart Route Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Routing -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

<!-- Esri Leaflet -->
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:Arial; background:#eef2f5 }
header {
  background:#0b3c5d;
  color:#fff;
  padding:14px 20px;
  font-size:20px;
  font-weight:bold;
}
#wrap {
  display:grid;
  grid-template-columns:380px 1fr;
  height:calc(100vh - 56px);
}
#panel {
  background:#fff;
  padding:12px;
  border-right:1px solid #ccc;
  overflow:auto;
}
select {
  width:100%;
  padding:8px;
  margin:6px 0;
}
#info {
  background:#f1f5f9;
  padding:10px;
  border-radius:6px;
  font-size:14px;
}
canvas { margin-top:10px }
#map { height:100% }
</style>
</head>

<body>

<header>Jammu & Kashmir –  District Route Dashboard</header>

<div id="wrap">
  <div id="panel">
    <b>From District</b>
    <select id="from"></select>

    <b>To District</b>
    <select id="to"></select>

    <div id="info">Select districts to view route</div>

    <canvas id="villageChart"></canvas>
  </div>

  <div id="map"></div>
</div>

<script>
// ================= MAP & BASE LAYERS =================
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
});

const esriSatellite = L.esri.basemapLayer('Imagery');
const esriTerrain   = L.esri.basemapLayer('Terrain');
const esriDark      = L.esri.basemapLayer('DarkGray');
const esriTopo      = L.esri.basemapLayer('Topographic');
const esriLabels    = L.esri.basemapLayer('ImageryLabels');

const map = L.map('map', {
  center:[33.8,75.1],
  zoom:7,
  layers:[osm]
});

L.control.layers({
  "OpenStreetMap": osm,
  "Esri Satellite": esriSatellite,
  "Esri Terrain": esriTerrain,
  "Esri Dark": esriDark,
  "Esri Topographic": esriTopo
}).addTo(map);

// ================= DISTRICTS =================
const districts = {
  Anantnag:[33.73,75.15], Bandipora:[34.42,74.64], Baramulla:[34.19,74.36],
  Budgam:[33.93,74.7], Doda:[33.15,75.55], Ganderbal:[34.23,74.77],
  Jammu:[32.73,74.86], Kathua:[32.39,75.52], Kishtwar:[33.31,75.77],
  Kulgam:[33.64,75.02], Kupwara:[34.53,74.25], Poonch:[33.77,74.09],
  Pulwama:[33.87,74.89], Rajouri:[33.38,74.31], Ramban:[33.24,75.24],
  Reasi:[33.08,74.83], Samba:[32.55,75.11], Shopian:[33.72,74.83],
  Srinagar:[34.08,74.79], Udhampur:[32.92,75.14]
};

// ================= SAMPLE VILLAGES =================
const villages = [
  {name:"Awantipora", lat:33.92, lng:75.01},
  {name:"Bijbehara", lat:33.79, lng:75.11},
  {name:"Banihal", lat:33.42, lng:75.20},
  {name:"Qazigund", lat:33.64, lng:75.14},
  {name:"Kangan", lat:34.27, lng:74.78},
  {name:"Sopore", lat:34.30, lng:74.47}
];

// ================= UI =================
const fromSel = document.getElementById('from');
const toSel   = document.getElementById('to');

Object.keys(districts).forEach(d=>{
  fromSel.add(new Option(d,d));
  toSel.add(new Option(d,d));
});

// ================= UTIL FUNCTIONS =================
let routingControl, villageMarkers=[], chart;
let carMarker, carIndex=0, carInterval;

function hav(lat1, lon1, lat2, lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)**2;
  return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

function distanceToRoute(v, coords){
  return Math.min(...coords.map(c=>hav(v.lat,v.lng,c.lat,c.lng)));
}

function drawChart(count){
  if(chart) chart.destroy();
  chart=new Chart(document.getElementById('villageChart'),{
    type:'bar',
    data:{labels:['Villages/Towns on Route'],datasets:[{data:[count]}]},
    options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}
  });
}

function animateCar(coords){
  if(carMarker){ map.removeLayer(carMarker); clearInterval(carInterval); }
  carIndex=0;
  carMarker=L.marker([coords[0].lat,coords[0].lng],{
    icon:L.icon({
      iconUrl:'https://cdn-icons-png.flaticon.com/512/743/743007.png',
      iconSize:[32,32]
    })
  }).addTo(map);

  carInterval=setInterval(()=>{
    if(carIndex>=coords.length){clearInterval(carInterval);return;}
    carMarker.setLatLng([coords[carIndex].lat,coords[carIndex].lng]);
    carIndex++;
  },400);
}

// ================= ROUTE LOGIC =================
function updateRoute(){
  villageMarkers.forEach(m=>map.removeLayer(m));
  villageMarkers=[];
  if(routingControl) map.removeControl(routingControl);

  const d1=fromSel.value, d2=toSel.value;
  if(!d1||!d2) return;

  routingControl=L.Routing.control({
    waypoints:[L.latLng(...districts[d1]),L.latLng(...districts[d2])],
    addWaypoints:false,
    draggableWaypoints:false,
    show:false
  }).addTo(map);

  routingControl.on('routesfound',e=>{
    const r=e.routes[0];
    const coords=r.coordinates.map(c=>({lat:c.lat,lng:c.lng}));

    const bufferKm=15;
    const onRoute=villages.filter(v=>distanceToRoute(v,coords)<=bufferKm);

    onRoute.forEach(v=>{
      villageMarkers.push(
        L.marker([v.lat,v.lng]).bindPopup(v.name).addTo(map)
      );
    });

    drawChart(onRoute.length);
    animateCar(coords);

    document.getElementById('info').innerHTML=
      `<b>${d1} → ${d2}</b><br>
       Distance: ${(r.summary.totalDistance/1000).toFixed(2)} km<br>
       Villages/Towns: ${onRoute.length}`;
  });
}

fromSel.onchange=updateRoute;
toSel.onchange=updateRoute;
fromSel.selectedIndex=0;
toSel.selectedIndex=1;
updateRoute();
</script>

</body>
  </html>
